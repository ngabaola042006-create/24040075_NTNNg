<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #243247; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 620px); padding: 36px; background: #fff; border: 1px solid #e5eaf2; border-radius: 18px; box-shadow: 0 12px 32px rgba(34, 58, 88, .08); }
    h1 { margin: 0 0 26px; color: #245c81; font-size: 1.8rem; }
    dl { margin: 0; }
    .item { padding: 17px 0; border-top: 1px solid #edf0f5; }
    dt { margin-bottom: 8px; color: #53657a; font-size: .9rem; font-weight: 600; }
    dd { min-height: 1.4em; margin: 0; }
    @media (max-width: 480px) { main { padding: 26px 22px; } }
  </style>
</head>
<body>
  <main>
    <h1>Giới thiệu cá nhân</h1>
    <dl>
      <div class="item"><dt>Họ và tên</dt><dd></dd></div>
      <div class="item"><dt>Chuyên ngành</dt><dd></dd></div>
      <div class="item"><dt>Kỹ năng</dt><dd></dd></div>
      <div class="item"><dt>Mục tiêu nghề nghiệp</dt><dd></dd></div>
    </dl>
  </main>
</body>
</html>
